<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Stag & Stone Coffeehouse — Menu</title>

  <!-- App icon / favicon -->
  <link rel="icon" href="favicon.png" sizes="64x64" />

      <!-- Brand -->

        <a class="cornerBtn" href="tel:0000000000" id="callBtn" aria-label="Call the coffeehouse">

      <div class="sub copper">
        Seasonal • Prices as listed
      </div>

    </header>

    <section class="menu" id="menu" role="region" aria-label="Menu items">
      <div class="loading">Loading menu…</div>

  <script src="app.js?v=20251229e" defer></script>
