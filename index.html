<!-- index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stag & Stone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="menu" aria-label="Stag & Stone Menu">

    <header class="header">
      <div class="kicker">Stag &amp; Stone Coffeehouse</div>
      <h1 class="copper">Menu</h1>
      <div class="subnote">Seasonal • Prices as listed</div>
    </header>

    <section class="section">
      <h2 class="copper">House Coffees</h2>

      <div class="item"><span>Stag’s Dark Roast</span><span class="copper">$14</span></div>
      <div class="item"><span>Dawnwood Medium Roast</span><span class="copper">$14</span></div>
      <div class="item"><span>Cold Brew</span><span class="copper">$14</span></div>
      <div class="item"><span>Nitro Cold Brew</span><span class="copper">$14</span></div>
    </section>

    <div class="divider" aria-hidden="true"></div>

    <section class="section">
      <h2 class="copper">Espresso Drinks</h2>

      <div class="item"><span>Espresso</span><span class="copper">$14</span></div>
      <div class="item"><span>Americano</span><span class="copper">$14</span></div>
      <div class="item"><span>Cappuccino</span><span class="copper">$14</span></div>
      <div class="item"><span>Latte</span><span class="copper">$14</span></div>
    </section>

    <footer class="footer">
      <div class="small">Dahlonega, Georgia</div>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
