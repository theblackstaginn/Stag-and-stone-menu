<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Stag & Stone Menu</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="stage" aria-label="Stag & Stone Menu">
    <!-- Border image (full-screen) -->
    <div class="border" aria-hidden="true"></div>

    <!-- Effects (optional) -->
    <div class="runes runes-top" aria-hidden="true"></div>
    <div class="runes runes-bottom" aria-hidden="true"></div>
    <canvas id="embers" aria-hidden="true"></canvas>

    <!-- Content lives INSIDE the border and scrolls -->
    <section class="content" role="document">
      <header class="masthead">
        <h1 class="title">STAG &amp; STONE</h1>
        <div class="rule" aria-hidden="true"></div>
      </header>

      <!-- Scroll container -->
      <section class="stack" aria-label="Menu">
        <div class="row2">
          <section class="block" id="houseCoffees"></section>
          <section class="block" id="espressoClassics"></section>
        </div>

        <div class="row2">
          <section class="block" id="featuredLattes"></section>
          <section class="block" id="signatureCoffeehouse"></section>
        </div>

        <section class="block center" id="teasHerbals"></section>

        <div class="row2">
          <section class="block" id="sandwiches"></section>
          <section class="block" id="pastries"></section>
        </div>
      </section>
    </section>
  </main>

  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
