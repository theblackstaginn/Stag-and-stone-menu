<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#c7c2b9" />
  <title>Stag & Stone Menu</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="stage" aria-label="Stag & Stone Menu">
    <!-- FRAME (ornate, rustic) -->
    <div class="frame" role="presentation">
      <!-- Background layers -->
      <div class="plaster" aria-hidden="true"></div>

      <!-- Negative-space ritual layers (never behind text) -->
      <div class="runes runes-top" aria-hidden="true"></div>
      <div class="runes runes-gutter" aria-hidden="true"></div>
      <div class="runes runes-bottom" aria-hidden="true"></div>
      <canvas id="embers" aria-hidden="true"></canvas>

      <!-- CONTENT -->
      <section class="content">
        <header class="masthead">
          <h1 class="title">STAG &amp; STONE</h1>
        </header>

        <section class="body-grid">
          <!-- Two columns -->
          <div class="col col-left" id="colLeft"></div>
          <div class="col col-right" id="colRight"></div>

          <!-- Food anchor spans full width at bottom -->
          <div class="food" id="food"></div>
        </section>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
