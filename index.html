<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Stag & Stone Coffeehouse — Menu</title>

  <link rel="stylesheet" href="styles.css?v=20251229-7" />
</head>

<body>
  <!-- Decorative border that snaps to the screen -->
  <div class="frame" aria-hidden="true"></div>

  <!-- Panel content inside the frame -->
  <main class="panel" aria-label="Stag & Stone Coffeehouse Menu">
    <header class="top">
      <div class="kicker">STAG &amp; STONE COFFEEHOUSE</div>
      <h1 class="title">Menu</h1>
      <div class="sub">Seasonal • Prices as listed</div>
      
    </header>

    <!-- Only scroll container -->
    <section class="menuScroll" id="menu" role="region" aria-label="Menu items" tabindex="0">
      <div class="loading">Loading menu…</div>
    </section>

    <footer class="bottom">
      <div class="location">Dahlonega, Georgia</div>
    </footer>
  </main>

  <script src="app.js?v=20251229" defer></script>
</body>
</html>
