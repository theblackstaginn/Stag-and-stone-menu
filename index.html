<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050403" />

  <title>Stag & Stone Menu</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css?v=2025.12.28.1" />
</head>

<body>
  <!-- Portrait block (phones) -->
  <div class="rotate-ward" aria-hidden="true">
    <div class="rotate-ward__text">Rotate Device</div>
  </div>

  <!-- Stage -->
  <main class="stage">
    <section class="plaque" role="region" aria-label="Stag & Stone Menu Board">
      <div class="frame-outer"></div>
      <div class="frame-inner"></div>

      <header class="top">
        <h1 class="title">STAG &amp; STONE</h1>
        <div class="rule"></div>
      </header>

      <!-- This is where menu.js injects content -->
      <div class="fit">
        <div id="menu" class="menu"></div>
      </div>
    </section>
  </main>

  <!-- Scripts -->
  <script defer src="menu.js?v=2025.12.28.1"></script>
  <script defer src="app.js?v=2025.12.28.1"></script>
</body>
</html>
