<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#1b1b1b" />
  <title>Stag & Stone Menu</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Optional (for “show people on phone” home-screen icon) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
</head>

<body>
  <main class="stage" aria-label="Stag & Stone Menu">
    <div class="frame" role="presentation">
      <div class="plaster" aria-hidden="true"></div>

      <!-- Keep FX layers OUT of text. We’ll place them only in empty zones later. -->
      <div class="runes zone zone-left" aria-hidden="true"></div>
      <div class="runes zone zone-right" aria-hidden="true"></div>
      <div class="runes zone zone-bottom-left" aria-hidden="true"></div>
      <div class="runes zone zone-bottom-right" aria-hidden="true"></div>
      <canvas id="embers" aria-hidden="true"></canvas>

      <section class="content">
        <header class="masthead">
          <h1 class="title copper">STAG &amp; STONE</h1>
        </header>

        <!-- Layout matches your sketch -->
        <section class="layout">
          <div class="panel panel-left" id="leftPanel"></div>
          <div class="panel panel-right" id="rightPanel"></div>

          <div class="panel panel-center" id="centerPanel"></div>

          <div class="panel panel-sandwiches" id="sandwichPanel"></div>
          <div class="panel panel-pastries" id="pastryPanel"></div>
        </section>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
