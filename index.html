<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Stag & Stone Coffeehouse — Menu</title>

  <!-- App icon / favicon -->
  <link rel="icon" href="favicon.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta name="theme-color" content="#050609" />

  <link rel="stylesheet" href="styles.css?v=20251229c" />
</head>

<body>
  <!-- FX layers -->
  <canvas id="embers" aria-hidden="true"></canvas>
  <canvas id="runes" aria-hidden="true"></canvas>

  <!-- Content -->
  <main class="panel" aria-label="Stag & Stone Coffeehouse Menu">
    <header class="top">
      <div class="kicker copper">STAG &amp; STONE COFFEEHOUSE</div>

      <!-- Buttons flank the Menu title (your red squares) -->
      <div class="menuHeader">
        <a class="cornerBtn" href="#" id="orderBtn" aria-label="Order online">ORDER<br>ONLINE</a>

        <h1 class="title copper">Menu</h1>

        <a class="cornerBtn" href="tel:0000000000" id="callBtn" aria-label="Call the coffeehouse">CALL-IN</a>
      </div>

      <div class="sub">Seasonal • Prices as listed</div>
      <div class="meta" id="buildMeta" aria-hidden="true"></div>
    </header>

    <section class="menu" id="menu" role="region" aria-label="Menu items">
      <div class="loading">Loading menu…</div>
    </section>

    <footer class="bottom">
      <div class="location">Dahlonega, Georgia</div>
    </footer>
  </main>

  <script src="app.js?v=20251229c" defer></script>
</body>
</html>
